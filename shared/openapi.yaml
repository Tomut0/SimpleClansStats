openapi: 3.2.0

info:
  title: SimpleClansStats API
  description: API for the SimpleClansStats web application.
  contact:
    email: minat0_@outlook.com
  license:
    name: Apache 2.0
    url: https://github.com/Tomut0/SimpleClansStats/blob/master/LICENSE
  version: 2.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://stats.example.com/api/v1
    description: Production

tags:
  - name: auth

paths:
  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                user:
                  email: player1@example.com
                  username: player1
                  role: user
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email/password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: player1@example.com
              password: hunter2
      responses:
        "200":
          description: Login successful; sets the session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                email: player1@example.com
                role: user
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Internal Server Error
  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      operationId: logout
      responses:
        "204":
          description: Session destroyed
        "500":
          description: Internal Server Error
          
  # ===========================================================================
  # Servers
  # ===========================================================================
  /settings:
    get:
      summary: Get application settings
      operationId: getAppSettings
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        "500": { description: Internal Server Error }
    post:
      summary: Save application settings as an administrator
      operationId: updateAppSettings
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/AppSettingsFields"
                - type: object
                  properties:
                    logo: { type: string, format: binary, description: Optional PNG or JPEG up to 1 MiB }
      responses:
        "200":
          description: Saved application settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        "400": { description: Invalid settings or logo }
        "401": { description: Login required }
        "403": { description: Administrator required }
        "413": { description: Request too large }
        "500": { description: Internal Server Error }

  /settings/logo:
    get:
      summary: Get the application logo
      operationId: getAppLogo
      responses:
        "200":
          description: Application logo
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { description: No custom logo }
        "500": { description: Internal Server Error }


  /servers:
    get:
      tags: [servers]
      summary: List all servers
      operationId: getServers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
              examples:
                empty:
                  summary: No servers
                  value: []
                with_servers:
                  summary: With servers
                  value:
                    - id: "6ecad9ed-b8b1-49f2-8443-3b73203ba033"
                      displayName: "My Server"
                      disabled: false
                      online: true
        "500":
          description: Internal Server Error

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    AppSettingsFields:
      type: object
      required: [appName, removeAuthor, timeZone, dateFormat, timeFormat]
      properties:
        appName: { type: string, maxLength: 100 }
        removeAuthor: { type: boolean }
        timeZone: { type: string, example: Europe/Moscow }
        dateFormat: { type: string, enum: [DD.MM.YYYY, YYYY-MM-DD, MM/DD/YYYY] }
        timeFormat: { type: string, enum: [24h, 12h] }

    AppSettings:
      allOf:
        - $ref: "#/components/schemas/AppSettingsFields"
        - type: object
          required: [logoVersion]
          properties:
            logoVersion: { type: integer, format: int64, minimum: 0 }



    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      required:
        - email
        - username
        - role
      properties:
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - member
            - guest

    Server:
      type: object
      required: [id, displayName, disabled, online]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, example: "My Server" }
        online: { type: boolean, example: true }
        disabled: { type: boolean, example: false }
  
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: unauthorized
        message:
          type: string
          example: Invalid credentials
        details:
          type: object
          additionalProperties: true

  responses:
    Unauthorized:
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
