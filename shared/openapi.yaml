openapi: 3.2.0

info:
  title: SimpleClansStats API
  description: API for the SimpleClansStats web application.
  contact:
    email: minat0_@outlook.com
  license:
    name: Apache 2.0
    url: https://github.com/Tomut0/SimpleClansStats/blob/master/LICENSE
  version: 2.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://stats.example.com/api/v1
    description: Production

tags:
  - name: auth
  - name: servers
  - name: ingest

paths:
  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                user:
                  email: player1@example.com
                  username: player1
                  role: user
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email/password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: player1@example.com
              password: hunter2
      responses:
        "200":
          description: Login successful; sets the session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                email: player1@example.com
                role: user
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Internal Server Error
  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      operationId: logout
      responses:
        "204":
          description: Session destroyed
        "500":
          description: Internal Server Error
          
  # ===========================================================================
  # Servers
  # ===========================================================================
  /settings:
    get:
      summary: Get application settings
      operationId: getAppSettings
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        "500": { description: Internal Server Error }
    post:
      summary: Save application settings as an administrator
      operationId: updateAppSettings
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/AppSettingsFields"
                - type: object
                  properties:
                    logo: { type: string, format: binary, description: Optional PNG or JPEG up to 1 MiB }
                    serverOnlineTimeoutMinutes: { type: integer, format: int64, minimum: 1, maximum: 1440 }
                    ingestRetentionDays: { type: integer, format: int64, minimum: 0, maximum: 36500 }
      responses:
        "200":
          description: Saved application settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        "400": { description: Invalid settings or logo }
        "401": { description: Login required }
        "403": { description: Administrator required }
        "413": { description: Request too large }
        "500": { description: Internal Server Error }

  /settings/logo:
    get:
      summary: Get the application logo
      operationId: getAppLogo
      responses:
        "200":
          description: Application logo
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { description: No custom logo }
        "500": { description: Internal Server Error }


  /servers:
    get:
      tags: [servers]
      summary: List all servers
      operationId: getServers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
              examples:
                empty:
                  summary: No servers
                  value: []
                with_servers:
                  summary: With servers
                  value:
                    - id: "6ecad9ed-b8b1-49f2-8443-3b73203ba033"
                      displayName: "My Server"
                      disabled: false
                      online: true
                      lastIngestAt: "2026-11-10T12:00:00Z"
        "500":
          description: Internal Server Error
    post:
      tags: [servers]
      summary: Register a Minecraft server and issue its collector key
      operationId: createServer
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201":
          description: Registered server. The API key is returned only by this operation.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerRegistration" }
        "400": { description: Invalid server name }
        "401": { description: Login required }
        "403": { description: Administrator required }
        "500": { description: Internal Server Error }

  /servers/{serverId}:
    delete:
      tags: [servers]
      summary: Delete a server and its snapshot history
      operationId: deleteServer
      security:
        - sessionCookie: []
      parameters:
        - name: serverId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Server deleted or already absent }
        "400": { description: Invalid server ID }
        "401": { description: Login required }
        "403": { description: Administrator required }
        "500": { description: Internal Server Error }

  /ingest:
    post:
      tags: [ingest]
      summary: Record receipt, events and any state change from SCCollector
      operationId: ingest
      security:
        - ingestApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [takenAt, clans, players]
              properties:
                takenAt: { type: string, format: date-time, description: When SCCollector captured the state }
                serverId: { type: string, format: uuid, description: Optional assertion of the server bound to the API key }
                clans:
                  type: array
                  items:
                    type: object
                    required: [externalId, tag, name]
                    properties:
                      externalId: { type: string }
                      tag: { type: string }
                      name: { type: string }
                players:
                  type: array
                  items:
                    type: object
                    required: [uuid, name]
                    properties:
                      uuid: { type: string, format: uuid }
                      name: { type: string }
                extensions:
                  type: object
                  properties:
                    scCollectorV1:
                      type: object
                      description: SCCollector v1 data for online players, wars, invites, claims and events
                      additionalProperties: true
                  additionalProperties: true
      responses:
        "202":
          description: Ingest accepted. A snapshot is stored only when the state changes.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, processedAt]
                properties:
                  accepted: { type: boolean }
                  processedAt: { type: string, format: date-time }
        "400": { description: Invalid snapshot }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: Snapshot exceeds 8 MiB }
        "415": { description: Expected application/json }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { description: Internal Server Error }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    ingestApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ServerRegistration:
      type: object
      required: [server, apiKey]
      properties:
        server: { $ref: "#/components/schemas/Server" }
        apiKey: { type: string }

    AppSettingsFields:
      type: object
      required: [appName, removeAuthor, timeZone, dateFormat, timeFormat]
      properties:
        appName: { type: string, maxLength: 100 }
        removeAuthor: { type: boolean }
        timeZone: { type: string, example: Europe/Moscow }
        dateFormat: { type: string, enum: [DD.MM.YYYY, YYYY-MM-DD, MM/DD/YYYY] }
        timeFormat: { type: string, enum: [24h, 12h] }

    AppSettings:
      allOf:
        - $ref: "#/components/schemas/AppSettingsFields"
        - type: object
          required: [logoVersion, serverOnlineTimeoutMinutes, ingestRetentionDays]
          properties:
            logoVersion: { type: integer, format: int64, minimum: 0 }
            serverOnlineTimeoutMinutes: { type: integer, format: int64, minimum: 1, maximum: 1440 }
            ingestRetentionDays: { type: integer, format: int64, minimum: 0, maximum: 36500 }



    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      required:
        - email
        - username
        - role
      properties:
        email:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - member
            - guest

    Server:
      type: object
      required: [id, displayName, disabled, online, lastIngestAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, example: "My Server" }
        online: { type: boolean, example: true }
        disabled: { type: boolean, example: false }
        lastIngestAt: { type: [string, "null"], format: date-time, description: When the last successful ingest was received }
  
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: unauthorized
        message:
          type: string
          example: Invalid credentials
        details:
          type: object
          additionalProperties: true

  responses:
    Unauthorized:
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
