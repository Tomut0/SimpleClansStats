openapi: 3.2.0

info:
  title: SimpleClansStats API
  description: API for the SimpleClansStats web application.
  contact:
    email: minat0_@outlook.com
  license:
    name: Apache 2.0
    url: https://github.com/Tomut0/SimpleClansStats/blob/master/LICENSE
  version: 2.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://stats.example.com/api/v1
    description: Production

tags:
  - name: auth

paths:
  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: ["object", "null"]
                    properties:
                      username: { type: string }
                      role: { type: string, enum: [admin, member, guest] }
              example:
                user:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  email: player1@example.com
                  role: user
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email/password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: player1
              password: hunter2
      responses:
        "200":
          description: Login successful; sets the session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                email: player1@example.com
                role: user
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ===========================================================================
  # Servers
  # ===========================================================================
  /servers:
    get:
      tags: [servers]
      summary: List all servers
      operationId: getServers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
              examples:
                empty:
                  summary: No servers
                  value: []
                with_servers:
                  summary: With servers
                  value:
                    - id: "6ecad9ed-b8b1-49f2-8443-3b73203ba033"
                      displayName: "My Server"
                      disabled: false
                      online: true
        "500":
          description: Internal Server Error

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    User:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - member
            - guest

    Server:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, example: "My Server" }
        online: { type: boolean, example: true }
        disabled: { type: boolean, example: false }

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: unauthorized
        message:
          type: string
          example: Invalid credentials
        details:
          type: object
          additionalProperties: true

  responses:
    Unauthorized:
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"